apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-depl
  namespace: comic-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: localhost:32000/backend:v1
          env:
            - name: DB_URI
              value: "mongodb://mongo-srv:27017/manga"
            - name: PORT
              value: "3001"
            - name: CLIENT_URI
              value: "http://0.0.0.0:3000"
            - name: AVATAR_COLLECTION
              value: "avatar_col"
            - name: COMIC_COLLECTION
              value: "comic_col"

            - name: REFRESH_TOKEN_SIGNATURE
              valueFrom:
                secretKeyRef:
                  name: comic-website-secrets
                  key: REFRESH_TOKEN
            - name: ACCESS_TOKEN_SIGNATURE
              valueFrom:
                secretKeyRef:
                  name: comic-website-secrets
                  key: ACCESS_TOKEN

            - name: DB_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comic-website-secrets
                  key: DB_USER_PASSWORD
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: comic-website-secrets
                  key: DB_USER

            - name: API
              value: "/api/v1"

---
apiVersion: v1
kind: Service
metadata:
  name: backend-srv
  namespace: comic-website
spec:
  selector:
    app: backend
  ports:
    - name: backend
      protocol: TCP
      port: 3001
      targetPort: 3001
