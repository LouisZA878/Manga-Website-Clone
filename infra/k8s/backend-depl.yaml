apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-depl
  namespace: comic-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: sakosa878/auth
          env:
            - name: DB_URI
              value: "mongodb://mongo-srv:27017/auth"

---
apiVersion: v1
kind: Service
metadata:
  name: backend-srv
  namespace: comic-website
spec:
  selector:
    app: backend
  ports:
    - name: backend
      protocol: TCP
      port: 3001
      targetPort: 3001
