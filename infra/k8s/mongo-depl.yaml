apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-depl
  namespace: comic-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:8.3.11
          env:
            - name: GLIBC_TUNABLES
              value: "glibc.pthread.rseq=1"
            - name: MONGO_INITDB_DATABASE
              value: "manga"
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comic-website-secrets
                  key: DB_USER_PASSWORD
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: comic-website-secrets
                  key: DB_USER
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-srv
  namespace: comic-website
spec:
  selector:
    app: mongo
  ports:
    - name: db
      protocol: TCP
      port: 27017
      targetPort: 27017
